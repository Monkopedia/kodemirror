kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
android.useAndroidX=true
# AGP 9 defaults to its new Android DSL and to its own built-in Kotlin support. Neither
# is compatible with the Kotlin Multiplatform plugin's `androidTarget()` +
# `com.android.library` combination that `kodemirror.library` uses: `newDsl` fails the KMP
# plugin at apply time (LibraryExtensionImpl cannot be cast to BaseExtension) and
# `builtInKotlin` collides with KMP over the `kotlin` extension name. Opt back out of both.
# Supported for all of AGP 9.x (AGP warns that it is deprecated); the legacy APIs behind
# them are slated for removal in AGP 10, so the real migration to the
# `com.android.kotlin.multiplatform.library` plugin is tracked in #208.
# See https://kotl.in/gradle/agp-new-kmp
#
# These must be set in the `systemProp.org.gradle.project.` form rather than as plain
# `android.newDsl=false` project properties. `kodemirror.library` is a precompiled script
# plugin in the `convention-plugins` included build, and Gradle generates its type-safe
# accessors by applying the plugin block to a synthetic project that reads neither this
# file nor `convention-plugins/gradle.properties` — so a plain project property (and even
# `-Pandroid.newDsl=false` on the command line) never reaches
# `generatePrecompiledScriptPluginAccessors`, and the build fails before any module is
# configured. Setting them as `org.gradle.project.`-prefixed system properties makes them
# project properties in every build in the tree, synthetic ones included.
systemProp.org.gradle.project.android.newDsl=false
systemProp.org.gradle.project.android.builtInKotlin=false
# Enable experimental Compose targets
org.jetbrains.compose.experimental.macos.enabled=true
org.jetbrains.compose.experimental.uikit.enabled=true
# GPG signing key for Maven Central publishing
signing.gnupg.executable=gpg
signing.gnupg.useLegacyGpg=false
