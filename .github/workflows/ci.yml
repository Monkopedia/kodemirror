name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  # `check` is the job name `main`'s branch protection requires, so it stays, as an aggregate of
  # the two jobs that do the work. Until #423 they were one job, and that job lost its hosted
  # runner on about 1 attempt in 6: a passing run peaked at 14.5 of the runner's 16 GB, and losses
  # continued after the wasm-link heap OOM was fixed. Split, each runner carries about half of it.
  #
  # `if: always()` is load-bearing. Without it a failed or cancelled half makes `check` *skipped*,
  # and branch protection counts a skipped required check as passing.
  check:
    needs: [check-jvm, check-wasm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both halves
        env:
          JVM: ${{ needs.check-jvm.result }}
          WASM: ${{ needs.check-wasm.result }}
        run: |
          echo "check-jvm: $JVM, check-wasm: $WASM"
          [ "$JVM" = success ] && [ "$WASM" = success ]

  check-jvm:
    # Back on ubuntu-latest (#423): the ubuntu-24.04 pin lost 3 of 17 attempts against 3 of 68
    # before it, so the Ubuntu 26 image was not the cause.
    runs-on: ubuntu-latest
    # Slowest successful run of the last 58 was 21.8 min (median 19.5), before the split. The
    # default is 360, so a real hang would otherwise hold a runner for six hours (#423).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # `--base-ref` below needs the base commit, which a depth-1 checkout does not have:
          # on a pull_request the checked-out ref is the merge commit and its parents are absent.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Validates every `changelog.d/` fragment name and body (#281). A malformed fragment would
      # otherwise surface only at the release cut, in the version-bump PR, which is the worst
      # place to discover it. Seconds, and it fails inside a branch-protection-required job.
      #
      # `--base-ref` additionally compares CHANGELOG.md against the merge base and refuses any
      # change to it that is not a release assembly (#297). Without it `check` reads only the
      # fragments, so a PR editing CHANGELOG.md directly passes — and since #295 removed
      # `## [Unreleased]`, such an edit no longer conflicts either: git lands the hunk inside an
      # already-published section and the merge is clean. The flag is omitted on `push` (no PR to
      # compare against); the script prints which branch it took, so an inert guard is visible in
      # the log rather than silent.
      # `github.event.pull_request.base.sha` rather than `origin/<base_ref>`: actions/checkout
      # fetches only the ref it checks out, so there is no `refs/remotes/origin/main` to name --
      # but the base commit is an ancestor of the merge commit and so is present at depth 0.
      - name: Validate changelog fragments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .github/scripts/test-changelog.py
          python3 .github/scripts/changelog.py check ${BASE_SHA:+--base-ref "$BASE_SHA"}
      # Memory samples for runs that finish (#423); a lost runner uploads nothing, not even its
      # job log, so this cannot explain a loss, only how close a passing run came to one.
      - name: Start memory sampler
        run: .github/scripts/mem-sampler.sh 30 mem.log > /dev/null 2>&1 &
      # `:kodemirror-bom:verifyBomCoverage` checks the generated BOM POM against the set of
      # modules that publish, failing on drift in either direction (#244). It is named here
      # because this job does not run `check`.
      #
      # `ktlintCheck` and `spotlessCheck` are named for the same reason, and are named *here*
      # rather than in a job of their own because this job gates `check`, the only Linux job in
      # `main`'s branch protection (which requires `check`, `check-macos` and `check-ios`). Until #299 neither
      # task appeared in any workflow file: both hang off `check`, which this job deliberately
      # does not run, so listing tasks explicitly had silently dropped them. `spotlessCheck` is
      # the consequential one -- it is what applies `spotless/license-header.kt` over
      # `src/**/*.kt` in all 57 modules, and that header carries both the Apache-2.0 notice and
      # the "Originally based on CodeMirror 6 by Marijn Haverbeke, licensed under MIT" line this
      # MIT-derived port is obliged to keep. A source file stripped of its header passed every
      # gating task before this line existed. `ktlintCheck` is a separate tool with separate
      # rules (.editorconfig), so both names are needed; neither compiles anything, and together
      # they add ~25s to a job that already pays for configuration.
      - name: Lint and test (JVM + Android)
        run: >-
          ./gradlew apiCheck ktlintCheck spotlessCheck jvmTest :kodemirror-bom:verifyBomCoverage
          -Dkotlin.daemon.jvmargs="-Xmx4g"
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          :view:verifyRoborazziJvm
          testDebugUnitTest
      - name: Upload memory samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-jvm-mem-log
          path: mem.log
          if-no-files-found: warn

  check-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Memory samples for runs that finish (#423); a lost runner uploads nothing, not even its
      # job log, so this cannot explain a loss, only how close a passing run came to one.
      - name: Start memory sampler
        run: .github/scripts/mem-sampler.sh 30 mem.log > /dev/null 2>&1 &
      # The wasmJsTest tasks in this job are exactly the modules that opt in via
      # `kodemirrorLibrary { wasmJsTests.set(true) }`; they are listed one by one so that a
      # module dropping out of the opt-in set shows up as a diff here rather than as a silent
      # no-op. They run on Karma + headless Chrome (preinstalled on the hosted Ubuntu image), not Node,
      # because skiko's `skiko.mjs` is a browser-only build (#202). Their wasm
      # compiles are independent of the JVM half, so this job builds nothing `check-jvm` needs.
      #
      # One confirmed contributor to the #423 losses is these tasks' test-binary links exhausting
      # the Kotlin daemon heap when they overlap; `WasmLinkLimiter` in convention-plugins caps it.
      - name: Test (wasmJs)
        run: >-
          ./gradlew
          -Dkotlin.daemon.jvmargs="-Xmx4g"
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          :autocomplete:wasmJsTest
          :collab:wasmJsTest
          :commands:wasmJsTest
          :lang-cpp:wasmJsTest
          :lang-css:wasmJsTest
          :lang-go:wasmJsTest
          :lang-html:wasmJsTest
          :lang-java:wasmJsTest
          :lang-javascript:wasmJsTest
          :lang-jinja:wasmJsTest
          :lang-json:wasmJsTest
          :lang-liquid:wasmJsTest
          :lang-markdown:wasmJsTest
          :lang-php:wasmJsTest
          :lang-python:wasmJsTest
          :lang-rust:wasmJsTest
          :lang-sass:wasmJsTest
          :lang-xml:wasmJsTest
          :lang-yaml:wasmJsTest
          :language:wasmJsTest
          :legacy-modes:wasmJsTest
          :lezer-common:wasmJsTest
          :lezer-highlight:wasmJsTest
          :lezer-lr:wasmJsTest
          :lint:wasmJsTest
          :lsp-client:wasmJsTest
          :merge:wasmJsTest
          :search:wasmJsTest
          :state:wasmJsTest
          :view:wasmJsTest
          :vim:wasmJsTest
      - name: Upload memory samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-wasm-mem-log
          path: mem.log
          if-no-files-found: warn

  # Android Lint, as its own job so it costs nothing serially against `check`.
  #
  # Until #263 this task was inert: under the legacy `com.android.library` + `androidTarget()`
  # combination the variant's source providers listed only `src/main/java`, `src/debug/java`,
  # `src/androidMain/kotlin`, `src/main/kotlin` and `src/debug/kotlin` — never `src/commonMain/kotlin`,
  # where essentially the whole library lives. `lintDebug` reported "No issues found" on code it had
  # not read, which is why `NewApi` was silent about #258's 34 `removeLast()`/`removeFirst()` calls.
  # The convention plugin now registers the `androidMain` dependsOn closure with the variant's Kotlin
  # sources; running the task here is the other half — a check that is fixed but never invoked is the
  # same inert control in a different disguise.
  #
  # NOTE: this job is not in `main`'s branch protection (which requires `check`, `check-macos` and
  # `check-ios`). It shows red on the PR but does not block a merge until a maintainer adds it.
  lint:
    runs-on: ubuntu-latest
    # Slowest successful run of the last 58 was 7.0 min (median 5.5) (#423).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android Lint (all modules)
        run: >-
          ./gradlew lintDebug
          -Dkotlin.daemon.jvmargs="-Xmx4g"
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      # A green lint job with an empty report set is the failure this guards. `error` alone
      # only catches the set going to zero; the floor catches it *shrinking* — an AGP report
      # rename, a task rename, modules dropping out of the task graph. It would NOT have
      # caught #263 (an inert lint still writes 58 reports), so it is not a substitute for the
      # control; it protects the artifact, which is load-bearing evidence: confirming this
      # job's ~6-minute run was real work meant hand-inspecting these reports. Same shape as
      # `report-android-test-count.py` failing on `tests="0"`. Raise the floor when modules
      # are added; a drop below it should be explained, not accommodated.
      - name: Verify the lint report set is complete
        run: |
          expected=58
          count=$(find . -path '*/build/reports/lint-results-debug.xml' | wc -l)
          echo "lint reports produced: $count (floor $expected)"
          if [ "$count" -lt "$expected" ]; then
            echo "::error::Only $count lint reports, expected at least $expected. Lint reported green over a report set that silently shrank — investigate before lowering this floor."
            exit 1
          fi
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-debug.*"
          if-no-files-found: error
