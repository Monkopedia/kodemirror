name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # `:kodemirror-bom:verifyBomCoverage` checks the generated BOM POM against the set of
      # modules that publish, failing on drift in either direction (#244). It is named here
      # because this job does not run `check`.
      # The wasmJsTest tasks below are exactly the modules that opt in via
      # `kodemirrorLibrary { wasmJsTests.set(true) }`; they are listed one by one so that a
      # module dropping out of the opt-in set shows up as a diff here rather than as a silent
      # no-op. They run on Karma + headless Chrome (preinstalled on ubuntu-latest), not Node,
      # because skiko's `skiko.mjs` is a browser-only build (#202). The heap bump matches
      # docs.yml: linking ~29 wasm test binaries OOMs the Kotlin daemon at the 2g default.
      - name: Lint and test (JVM + wasmJs + Android)
        run: >-
          ./gradlew apiCheck jvmTest :kodemirror-bom:verifyBomCoverage
          -Dkotlin.daemon.jvmargs="-Xmx4g"
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          :view:verifyRoborazziJvm
          testDebugUnitTest
          :autocomplete:wasmJsTest
          :collab:wasmJsTest
          :commands:wasmJsTest
          :lang-cpp:wasmJsTest
          :lang-css:wasmJsTest
          :lang-go:wasmJsTest
          :lang-html:wasmJsTest
          :lang-java:wasmJsTest
          :lang-javascript:wasmJsTest
          :lang-json:wasmJsTest
          :lang-markdown:wasmJsTest
          :lang-php:wasmJsTest
          :lang-python:wasmJsTest
          :lang-rust:wasmJsTest
          :lang-sass:wasmJsTest
          :lang-xml:wasmJsTest
          :lang-yaml:wasmJsTest
          :language:wasmJsTest
          :legacy-modes:wasmJsTest
          :lezer-common:wasmJsTest
          :lezer-highlight:wasmJsTest
          :lezer-lr:wasmJsTest
          :lint:wasmJsTest
          :lsp-client:wasmJsTest
          :merge:wasmJsTest
          :search:wasmJsTest
          :state:wasmJsTest
          :view:wasmJsTest
          :vim:wasmJsTest

  # Android Lint, as its own job so it costs nothing serially against `check`.
  #
  # Until #263 this task was inert: under the legacy `com.android.library` + `androidTarget()`
  # combination the variant's source providers listed only `src/main/java`, `src/debug/java`,
  # `src/androidMain/kotlin`, `src/main/kotlin` and `src/debug/kotlin` — never `src/commonMain/kotlin`,
  # where essentially the whole library lives. `lintDebug` reported "No issues found" on code it had
  # not read, which is why `NewApi` was silent about #258's 34 `removeLast()`/`removeFirst()` calls.
  # The convention plugin now registers the `androidMain` dependsOn closure with the variant's Kotlin
  # sources; running the task here is the other half — a check that is fixed but never invoked is the
  # same inert control in a different disguise.
  #
  # NOTE: this job is not in `main`'s branch protection (which requires `check`, `check-macos` and
  # `check-ios`). It shows red on the PR but does not block a merge until a maintainer adds it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android Lint (all modules)
        run: >-
          ./gradlew lintDebug
          -Dkotlin.daemon.jvmargs="-Xmx4g"
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      # A green lint job with an empty report set is the failure this guards. `error` alone
      # only catches the set going to zero; the floor catches it *shrinking* — an AGP report
      # rename, a task rename, modules dropping out of the task graph. It would NOT have
      # caught #263 (an inert lint still writes 58 reports), so it is not a substitute for the
      # control; it protects the artifact, which is load-bearing evidence: confirming this
      # job's ~6-minute run was real work meant hand-inspecting these reports. Same shape as
      # `report-android-test-count.py` failing on `tests="0"`. Raise the floor when modules
      # are added; a drop below it should be explained, not accommodated.
      - name: Verify the lint report set is complete
        run: |
          expected=58
          count=$(find . -path '*/build/reports/lint-results-debug.xml' | wc -l)
          echo "lint reports produced: $count (floor $expected)"
          if [ "$count" -lt "$expected" ]; then
            echo "::error::Only $count lint reports, expected at least $expected. Lint reported green over a report set that silently shrank — investigate before lowering this floor."
            exit 1
          fi
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-debug.*"
          if-no-files-found: error
