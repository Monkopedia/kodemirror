name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The wasmJsTest tasks below are exactly the modules that opt in via
      # `kodemirrorLibrary { wasmJsTests.set(true) }`. Every other module's wasm test binary
      # reaches Compose (directly or through :language / :view) and cannot load skiko.mjs
      # under Node, so its wasmJsTest task is disabled and would be a silent no-op here (#202).
      - name: Lint and test (JVM + wasmJs + Android)
        run: >-
          ./gradlew apiCheck jvmTest
          :view:verifyRoborazziJvm
          testDebugUnitTest
          :state:wasmJsTest
          :collab:wasmJsTest
          :lezer-common:wasmJsTest
          :lezer-highlight:wasmJsTest
          :lezer-lr:wasmJsTest
